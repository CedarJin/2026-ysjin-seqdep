# Conda environment for gene-level quantification of metagenomic reads.
# Contains: subread (featureCounts), samtools, python + pandas/numpy.
# Create with: conda env create -f env/env_quant.yaml -n quant
# Activate with: conda activate quant

name: quant
channels:
  - bioconda
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - subread
  - samtools
  - pandas
  - numpy
