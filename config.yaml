# Configuration file for Snakemake workflow
# Download and process SRA metagenome data

# for faster run, I commented out some runs and depths

# SRA run IDs to download
runs:
  - SRR10692699
#  - SRR10692860

# Output directory for downloaded data
outdir: test-metagenome

# Number of threads for fasterq-dump
threads: 8

# Maximum size for prefetch (optional)
max_size: 30G

# Random seeds for seqtk downsampling (keeps runs reproducible)
downsample_seeds:
  - 11
#  - 22
#  - 33

# Downsampling depth labels (read pairs)
downsample_depths:
#  - 10M
#  - 20M
#  - 30M
#  - 40M
  - 50M

# CheckM2 database path
checkm2_database_path: reference/CheckM2_database/uniref100.KO.1.dmnd

# File extension used for MetaBAT2 bin FASTA files
bin_extension: fa

# FragGeneScanRs model for assembly-free DRAM workflow
# Options depend on FragGeneScanRs build; common: complete, train, high_error, illumina_10, 454_30
fraggenescanrs_model: illumina_10
