# Conda environment for assembly and binning: MEGAHIT, MetaBAT2, MaxBin2, CONCOCT, DAS_Tool, CheckM2, GTDB-Tk
# Create with: conda env create -f env_assembly_bin.yaml
# Activate with: conda activate assemble

name: assemble
channels:
  - bioconda
  - conda-forge
  - defaults
dependencies:
  - megahit
  - metabat2
  - maxbin2
  - concoct
  - das_tool
  - checkm2
  - gtdbtk
  - bowtie2
  - samtools
